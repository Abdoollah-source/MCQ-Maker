[project]
name = "mcq-maker"
version = "0.1.0"
description = "MCQ Maker Windows desktop application"
requires-python = ">=3.12,<3.15"
dependencies = ["PySide6-Essentials==6.10.2", "platformdirs==4.11.8", "jsonschema==4.26.0", "windows-toasts==1.3.1", "playwright==1.63.0"]

[project.optional-dependencies]
build = ["pyinstaller==6.20.0"]

[project.gui-scripts]
mcq-maker = "mcq_maker.app:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mcq_maker*"]

[tool.setuptools.package-data]
mcq_maker = ["assets/*.svg", "assets/*.txt", "assets/*.html", "assets/*.png", "assets/*.ico"]
